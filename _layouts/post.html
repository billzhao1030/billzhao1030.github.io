---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
