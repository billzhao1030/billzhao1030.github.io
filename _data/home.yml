software:
  heading: "Projects"
  description: "Open-source tools I build and maintain."
  items:
    - title: "SurveyAtlas: Living Literature Surveys"
      venue: "Open source · MIT · 2026"
      description: "Turns a research field into a self-updating survey website. LLM agents harvest arXiv and OpenAlex, classify papers into a field taxonomy, deep-read them and check every reported number against the paper text. The site offers a faceted library, Q&A with citations, a task × paradigm map, a timeline and protocol-aware leaderboards, and rebuilds itself every day. NavAtlas, the first atlas, covers 3,147 embodied-navigation papers."
      image: "assets/projects/surveyatlas-tp.jpg"
      image_alt: "SurveyAtlas project page"
      links:
        - label: "Project"
          url: "SurveyAtlas/"
        - label: "Demo"
          url: "SurveyAtlas/navatlas/"
        - label: "Code"
          url: "https://github.com/billzhao1030/SurveyAtlas"

