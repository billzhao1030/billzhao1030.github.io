about:
  heading: "About Me"
  paragraphs:
    - "Hi, I am a second-year Ph.D. student at the <a href='https://www.adelaide.edu.au/aiml/'>Australian Institute for Machine Learning (AIML)</a>, <a href='https://www.adelaide.edu.au/'>Adelaide University</a>, supervised by <a href='http://www.qi-wu.me/'>A/Prof. Qi Wu</a> and <a href='https://people.csiro.au/L/J/ryan-liu'>A/Prof. Jiajun Liu</a>. I am a member of the <a href='https://v3alab.github.io/'>Vision and Visualisation for Autonomous AI Lab (V3A Lab)</a>, where I work on embodied AI, vision-language reasoning, and autonomous agents."
    - "Prior to my Ph.D. studies, I received my Master’s degree from the University of Adelaide, now Adelaide University, where I was mentored by <a href='https://gengzezhou.github.io/'>Dr. Gengze Zhou</a>. Since 2026, I have been focusing on agentic AI for embodied AI tasks under the mentorship of <a href='https://gengzezhou.github.io/'>Dr. Gengze Zhou</a> and <a href='https://sihaoevery.github.io/'>Dr. Sihao Lin</a>. I also collaborate closely with <a href='https://jianzhou0420.github.io/'>Jian Zhou</a>, Zerui Li, and <a href='https://sj-li.com/'>Dr. Shijie Li</a>."
    - "My research focuses on building explainable and embodied AI systems for autonomous agents that can perceive, reason, learn, and navigate in complex 3D environments. I am particularly interested in evaluating and improving multimodal large language models for 3D understanding, spatial reasoning, lifelong learning, and ultra-long-horizon vision-and-language navigation. Recently, I have been exploring agentic AI frameworks for embodied tasks such as VLN, aiming to integrate perception, reasoning, memory, and decision-making into unified autonomous systems. More broadly, I am dedicated to bridging the gap between simulator-based embodied AI research and real-world robotic applications."

news:
  heading: "News"
  items:
    - date: "2026.10"
      text: "I open-sourced <a href='SurveyAtlas/'>SurveyAtlas</a> (<a href='https://github.com/billzhao1030/SurveyAtlas'>code</a>), a living literature survey: LLM agents harvest, classify and deep-read a field's papers, verify the reported results, and publish a searchable website with Q&A, a research map and leaderboards. The first atlas, <a href='SurveyAtlas/navatlas/'>NavAtlas</a>, covers 3,000+ embodied-navigation papers."
    - date: "2026.07"
      text: "Our new preprint <a href='https://arxiv.org/abs/2607.26148'>Embodied Agents Take Control</a> is out on arXiv! Given only a monocular RGB camera and four discrete actions, a general-purpose agent already rivals industrial-scale navigation policies on VLN."
    - date: "2026.06"
      text: "Our new preprint <a href='https://arxiv.org/abs/2606.03175'>Ask When It Pays</a> is out on arXiv! It is a cost-aware reactive agent for instance goal navigation that works out <em>when</em> asking a question is worth what it costs. My first attempt at building a ReAct-style agent."
    - date: "2026.04"
      text: "My first Research Paper <a href='https://aclanthology.org/2026.acl-long.1300/'>VLN-MME</a> is accepted to ACL 2026! Many thanks to my mentor Gengze, for his invaluable guidance and support."
    - date: "2025.12"
      text: "My first co-authored project, <a href='https://sihaoevery.github.io/vlnverse/'>VLNVerse</a> is now released!"
    - date: "2025.10"
      text: "I have started my PhD at the University of Adelaide."

research:
  heading: "Research"
  topics:
    - title: "Embodied AI"
      text: "Navigation agents that combine perception, memory, reasoning, and action in interactive environments."
    - title: "Multimodal Reasoning"
      text: "Large vision-language models for long-horizon planning, question answering, and scene understanding."
    - title: "Agentic AI"
      text: "Vision-language navigation agents that use multimodal observations, natural-language instructions, and step-by-step reasoning to plan actions in embodied environments."

